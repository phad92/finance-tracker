  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_tracker_backend
    restart: unless-stopped
    # depends_on:
    #   redis:
    #     condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Connect from container to PostgreSQL running on the host machine
      POSTGRES_SERVER: ${POSTGRES_SERVER_DOCKER:-host.docker.internal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: "True"
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

